  <path d="M50 12 L80 24 C80 50 50 82 50 82 C50 82 20 50 20 24 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- Bank Pillar Columns -->
