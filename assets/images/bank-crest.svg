  <polygon points="50,26 30,36 70,36" fill="url(#goldGrad)"/>
  <!-- Architrave -->
  <rect x="29" y="38" width="42" height="3" rx="1" fill="#FFFFFF"/>
  <!-- Columns -->
  <rect x="33" y="43" width="5" height="18" rx="1" fill="url(#cyanGrad)"/>
  <rect x="42" y="43" width="5" height="18" rx="1" fill="#FFFFFF"/>
  <rect x="53" y="43" width="5" height="18" rx="1" fill="#FFFFFF"/>
  <rect x="62" y="43" width="5" height="18" rx="1" fill="url(#cyanGrad)"/>
