  </defs>
  <!-- Shield Badge -->
  <path d="M50 5 L88 20 C88 55 50 92 50 92 C50 92 12 55 12 20 Z" fill="url(#crestGrad)" stroke="url(#cyanGrad)" stroke-width="2.5"/>
